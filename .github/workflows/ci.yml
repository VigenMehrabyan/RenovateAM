name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Ворота качества
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: renovateam
          POSTGRES_PASSWORD: renovateam
          POSTGRES_DB: renovateam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://renovateam:renovateam@localhost:5432/renovateam_test
      JWT_SECRET: ci-test-secret-do-not-use-in-production
      JWT_REFRESH_SECRET: ci-test-refresh-secret-do-not-use-in-production
      APP_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      # Версия pnpm берётся из поля packageManager в package.json —
      # единственный источник истины, тот же, что и локально.
      # Дублирование через `with: version` ломает установку (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      # Клиент Prisma генерируется в apps/api/src/generated и не хранится
      # в репозитории. postinstall делает это на чистом клоне, но шаг оставлен
      # явным: если установка когда-нибудь пойдёт с --ignore-scripts,
      # сборка должна падать здесь с понятной причиной, а не на импорте модуля.
      - name: Генерация клиента Prisma
        run: pnpm --filter @renovateam/api prisma:generate

      - name: Применение миграций
        run: pnpm --filter api db:setup

      - name: Линт
        run: pnpm lint

      - name: Проверка типов
        run: pnpm typecheck

      - name: Тесты
        run: pnpm test

      - name: Сборка
        run: pnpm build
