# Сборка и раздача SPA (apps/web) на Netlify.
# API живёт на Railway; фронт ходит к нему через прокси /api/* — тогда
# refresh-cookie остаётся same-site и не требует послаблений CORS.

[build]
  base = "."
  command = "pnpm install --frozen-lockfile && pnpm --filter @renovateam/web build && node scripts/write-netlify-redirects.mjs"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10"
  # Фронт обращается к API по относительному пути — его проксирует правило ниже.
  VITE_API_URL = "/api/v1"

# API proxy is generated as apps/web/dist/_redirects during the build.
# API_URL must be the HTTPS origin of the backend and have Builds scope.
# _redirects is evaluated before this SPA fallback.

# SPA: любой неизвестный путь отдаёт index.html, маршрутизацию делает react-router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
